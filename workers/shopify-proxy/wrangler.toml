# Cloudflare Worker Configuration
# Deploy with: wrangler deploy
# Set secrets: wrangler secret put SHOPIFY_ACCESS_TOKEN

name = "capy-inventory-shopify-proxy"
main = "index.ts"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGINS = "https://capyera.github.io,http://localhost:5173"

# Add your Shopify token as a secret (not in this file!)
# Run: wrangler secret put SHOPIFY_ACCESS_TOKEN
# Then paste your token from .env.shopify
